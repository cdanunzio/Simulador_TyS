<title>Maqueta ERP TyS v2.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --surface-2:#E8ECF0; --surface-3:#DDE3E9; --line:#CFD7DE; --line-2:#E3E8ED;
  --ink:#1A2330; --ink-2:#48566A; --ink-3:#78869A;
  --accent:#145C6B; --accent-ink:#FFFFFF; --accent-soft:#D9EAEE; --accent-line:#8FBAC3;
  --brand:#D9831A; --brand-soft:#FBEBD3;
  --ok:#2A7A4B; --ok-soft:#DCEFE2; --warn:#A8701A; --warn-soft:#FAEBCF; --crit:#B23A2A; --crit-soft:#F7DFD9; --info:#3A6799; --info-soft:#DEE8F4;
  --violet:#6A4FA0; --violet-soft:#E8E1F4;
  --shadow:0 1px 2px rgba(20,32,45,.06),0 4px 14px rgba(20,32,45,.06);
  --r:6px; --rs:4px;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --surface:#171F28; --surface-2:#1F2932; --surface-3:#28343F; --line:#2F3B47; --line-2:#26313C;
    --ink:#E6ECF2; --ink-2:#AAB6C3; --ink-3:#7D8A98;
    --accent:#5AAABA; --accent-ink:#0C1A1E; --accent-soft:#163239; --accent-line:#2E5F69;
    --brand:#EFA34E; --brand-soft:#3A2A14;
    --ok:#66BD87; --ok-soft:#173726; --warn:#E2AC52; --warn-soft:#3A2C12; --crit:#E5765F; --crit-soft:#3F1F19; --info:#86ACDA; --info-soft:#1A2B40;
    --violet:#A896D8; --violet-soft:#2B2340;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#171F28; --surface-2:#1F2932; --surface-3:#28343F; --line:#2F3B47; --line-2:#26313C;
  --ink:#E6ECF2; --ink-2:#AAB6C3; --ink-3:#7D8A98;
  --accent:#5AAABA; --accent-ink:#0C1A1E; --accent-soft:#163239; --accent-line:#2E5F69;
  --brand:#EFA34E; --brand-soft:#3A2A14;
  --ok:#66BD87; --ok-soft:#173726; --warn:#E2AC52; --warn-soft:#3A2C12; --crit:#E5765F; --crit-soft:#3F1F19; --info:#86ACDA; --info-soft:#1A2B40;
  --violet:#A896D8; --violet-soft:#2B2340;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:20px;letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:13.5px}
p{margin:0}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.small{font-size:12px}
.xs{font-size:11px}
.crit{color:var(--crit)}
.eq{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:var(--rs);background:var(--surface);min-width:0}
.eq.off{border-color:var(--crit);border-style:dashed}
.eq.sel{border-color:var(--accent)}
.eq>label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.eq>label input{width:auto;margin-top:3px;flex:none}
.eq .acts{display:flex;gap:6px;flex-wrap:wrap;padding-left:22px}
.up{text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;font-weight:600;color:var(--ink-3)}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--rs)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:100%;max-width:100%;overflow-x:clip}
.top{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand-mark{width:26px;height:26px;border-radius:5px;background:var(--brand);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:7px;right:5px;top:6px;height:4px;background:var(--surface);border-radius:2px}
.brand-mark::before{content:"";position:absolute;left:7px;top:6px;width:4px;height:15px;background:var(--surface);border-radius:2px}
.brand b{font-weight:600;font-size:14px}
.brand .ver{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:6px}
.ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctx label{display:flex;flex-direction:column;gap:2px}
.ctx label span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.ctx select{padding:4px 26px 4px 8px;border:1px solid var(--line);border-radius:var(--rs);background:var(--surface-2);min-width:150px;font-size:12.5px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 13px) 12px,calc(100% - 8px) 12px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.ctx select.rol{border-color:var(--accent-line);background-color:var(--accent-soft);font-weight:600}
.top-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.body{display:grid;grid-template-columns:216px 1fr;min-height:0;min-width:0;max-width:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:53px;align-self:start;height:calc(100vh - 53px);overflow:auto;min-width:0}
.nav .grp{margin:10px 8px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:7px 10px;border:0;background:transparent;border-radius:var(--rs);cursor:pointer;color:var(--ink-2);font-size:13px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{font-family:var(--mono);font-size:11px;background:var(--surface-3);color:var(--ink-2);padding:0 6px;border-radius:9px;min-width:18px;text-align:center}
.nav button.on .cnt{background:var(--accent);color:var(--accent-ink)}
.main{padding:18px 22px 40px;min-width:0}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.page-h .sub{color:var(--ink-2);margin-top:3px;max-width:70ch}
.page-h .acts{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500;font-size:12.5px;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:11.5px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea{padding:6px 8px;border:1px solid var(--line);border-radius:var(--rs);background:var(--surface);width:100%;min-width:0}
.field input:disabled,.field select:disabled{background:var(--surface-2);color:var(--ink-3)}
.field textarea{min-height:56px;resize:vertical}
.field.chk{flex-direction:row;align-items:center;gap:8px}
.field.chk input{width:auto}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px}
.form-grid .span2{grid-column:span 2}
.form-grid .span3{grid-column:1/-1}
.help{font-size:11.5px;color:var(--ink-3)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px}
.card.tight{padding:10px 12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-h h2,.card-h h3{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pipe{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kpi{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-size:11.5px;color:var(--ink-2)}
.kpi .d{font-size:11.5px;color:var(--ink-3)}
.kpi.warn .v{color:var(--warn)}.kpi.crit .v{color:var(--crit)}.kpi.ok .v{color:var(--ok)}.kpi.acc .v{color:var(--accent)}
.alert{padding:9px 12px;border-radius:var(--rs);border:1px solid;font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.alert.info{background:var(--info-soft);border-color:transparent;color:var(--ink)}
.alert.warn{background:var(--warn-soft);border-color:transparent}
.alert.crit{background:var(--crit-soft);border-color:transparent}
.alert.ok{background:var(--ok-soft);border-color:transparent}
.alert b{font-weight:600}
.alert ul{margin:4px 0 0;padding-left:18px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--ink-3);margin:0}
.kv dd{margin:0}
.divider{height:1px;background:var(--line-2);margin:4px 0}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t tr.sel td{background:var(--accent-soft)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t .empty{color:var(--ink-3);text-align:center;padding:18px}
table.t.compact td{padding:4px 8px}
table.t tfoot td{font-weight:600;background:var(--surface-2)}
.osid{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent);white-space:nowrap}
table.t td>.mono:first-child{white-space:nowrap}

/* ---------- pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5;background:var(--surface-3);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.BORR{background:var(--surface-3);color:var(--ink-2)}
.pill.PEND_PLAN{background:var(--info-soft);color:var(--info)}
.pill.PLANIF{background:var(--violet-soft);color:var(--violet)}
.pill.EJEC{background:var(--accent-soft);color:var(--accent)}
.pill.PEND_CIERRE{background:var(--warn-soft);color:var(--warn)}
.pill.CERRADA{background:var(--ok-soft);color:var(--ok)}
.pill.ANULADA{background:var(--crit-soft);color:var(--crit)}
select.perm{padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:12px;min-width:120px}
select.perm.abm{border-color:var(--accent);color:var(--accent)}
select.perm.oculto{color:var(--ink-3)}
.t td.grp-row{background:var(--surface-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:5px 8px}
.md-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px}
.md-form select[multiple]{min-height:82px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:var(--rs);font-size:11px;font-weight:500;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.chip.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.chip.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip.crit{border-color:transparent;background:var(--crit-soft);color:var(--crit)}
.chip.info{border-color:transparent;background:var(--info-soft);color:var(--info)}
.chip.acc{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.sup{display:inline-flex;align-items:center;padding:0 6px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.06em;border:1px dashed var(--brand);color:var(--brand);background:var(--brand-soft);line-height:1.6;vertical-align:middle;cursor:help}
.tag{display:inline-block;padding:0 6px;border-radius:3px;font-size:10.5px;background:var(--surface-3);color:var(--ink-2);font-family:var(--mono)}

/* ---------- progress ---------- */
.bar{height:8px;background:var(--surface-3);border-radius:4px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar>i.warn{background:var(--warn)}
.bar>i.ok{background:var(--ok)}
.meter{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:12px}

/* ---------- expediente ---------- */
.exp-h{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:53px;z-index:5}
.exp-h .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.exp-h .row1 h1{font-family:var(--mono);font-size:18px;font-weight:600}
.exp-h .conds{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.exp-h .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.exp-nav{display:flex;gap:2px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding-top:8px}
.exp-nav button{border:0;background:transparent;padding:4px 9px;border-radius:var(--rs);cursor:pointer;color:var(--ink-2);font-size:12.5px}
.exp-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.exp-nav button:hover{background:var(--surface-2)}
.sec{scroll-margin-top:170px}
.sec h2{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.sec h2 .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:500}
.hist{display:flex;flex-direction:column;gap:0;font-size:12.5px}
.hist .ev{display:grid;grid-template-columns:118px 150px 1fr;gap:12px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.hist .ev:last-child{border-bottom:0}
.hist .ts{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.hist .who{color:var(--ink-2)}
.hist .what b{font-weight:600}

/* ---------- wizard ---------- */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.steps span{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:12px;font-size:11.5px;background:var(--surface-2);color:var(--ink-3);border:1px solid transparent}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.steps span.cur{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--surface)}
.steps span::after{content:"›";opacity:.5;margin-left:2px}
.steps span:last-child::after{content:""}

/* ---------- resources timeline ---------- */
.tl{display:grid;grid-template-columns:200px repeat(8,1fr);font-size:11.5px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.tl>div{padding:6px 8px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);min-height:30px}
.tl .h{background:var(--surface-2);font-weight:600;color:var(--ink-3);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;text-align:center}
.tl .h.today{color:var(--accent)}
.tl .r{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .r small{display:block;color:var(--ink-3);font-weight:400}
.tl .c{display:flex;flex-direction:column;gap:2px}
.tl .b{display:block;padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:10.5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .b.PLANIF{background:var(--violet-soft);color:var(--violet)}
.tl .b.mant{background:var(--warn-soft);color:var(--warn)}
.tl .b.off{background:var(--crit-soft);color:var(--crit)}

/* ---------- datos maestros: navegador del modelo ---------- */
.mdb{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.mdnav{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:1px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.mdnav .grp{margin:8px 6px 3px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.mdnav button{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;padding:5px 8px;border:0;background:transparent;border-radius:var(--rs);cursor:pointer;color:var(--ink-2);font-size:12.5px}
.mdnav button:hover{background:var(--surface-2);color:var(--ink)}
.mdnav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.mdnav .cnt{font-family:var(--mono);font-size:10.5px;background:var(--surface-3);color:var(--ink-2);padding:0 6px;border-radius:9px;min-width:18px;text-align:center;flex:none}
.mdnav button.on .cnt{background:var(--accent);color:var(--accent-ink)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs button:hover{color:var(--ink)}

/* ---------- comparativas ---------- */
.cmp td.delta{font-variant-numeric:tabular-nums}
.cmp .up{color:var(--crit)}.cmp .down{color:var(--ok)}
.cmp td.plus{color:var(--crit)}.cmp td.minus{color:var(--ok)}

/* ---------- casos ---------- */
.caso{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:start}
.caso .n{font-family:var(--mono);font-size:18px;color:var(--brand);font-weight:500;line-height:1}
.caso ol{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.caso ol li{margin:2px 0}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,16,22,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);width:min(680px,100%);max-height:92vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mb{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
